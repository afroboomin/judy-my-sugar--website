<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love, Judy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #87CEEB;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4682B4;
            padding: 20px;
        }
        h1 {
            font-size: 3em;
            margin: 0;
        }
        p {
            font-size: 1.5em;
            margin: 20px 0;
        }
        .button-container {
            margin-top: 50px;
        }
        .surprise-button {
            background-color: #FF69B4;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .surprise-button:hover {
            background-color: #FF1493;
        }
    </style>
</head>
<body>
    <header>
        <h1>To My Dearest Judy</h1>
    </header>
    <main>
        <p>Judy I love you more than words can ever express.</p>
        <p>Every day with you is a gift, and I am so grateful to have you by my side.</p>
        <div class="button-container">
            <button class="surprise-button" onclick="showSurprise()">Click for a Big Surprise!</button>
        </div>
    </main>
    <script>
        function showSurprise() {
            window.location.href = 'https://example.com/rose.jpg'; // Replace this URL with the actual URL of the rose image
        }
    </script>
</body>
</html>
